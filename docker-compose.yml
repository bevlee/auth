# Local Postgres for `pnpm dev`: set PGHOST, PGPORT, PGDATABASE, PGUSER, and
# PGPASSWORD in .env, then run `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
