apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth-dev
  labels:
    app: auth
spec:
  replicas: 1
  revisionHistoryLimit: 1
  # Recreate so a redeploy never leaves two dev servers behind the ingress.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          # Bare artifact name so Skaffold rewrites it to the tag it builds.
          image: docker.io/bevdev1/auth
          # The :dev tag is reused, so always pull.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          env:
            - name: BETTER_AUTH_URL
              value: https://auth-dev.bevsoft.com
            - name: PGHOST
              value: postgres.db.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: auth_dev
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: auth-dev-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-dev-db
                  key: password
          # BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, RESEND_KEY,
          # AUTH_EMAIL: created by hand, see README.
          envFrom:
            - secretRef:
                name: auth-env
          securityContext:
            allowPrivilegeEscalation: false
            # The dev server writes caches and Skaffold syncs source files in,
            # so the root filesystem stays writable in dev.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Dev servers compile on the first request, so give it time before probing.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 6
