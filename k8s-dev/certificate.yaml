# Single-host cert, like prod: http01 can't issue wildcards, and a wildcard
# per dev namespace would also count against Let's Encrypt's duplicate-cert limit.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-dev
  namespace: auth-dev
spec:
  commonName: auth-dev.bevsoft.com
  dnsNames:
    - auth-dev.bevsoft.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: auth-dev-tls
