apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: auth
  labels:
    app: auth
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.bevsoft.com
      secretName: auth-tls
  rules:
    - host: auth.bevsoft.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
