# Single-host cert: letsencrypt-prod solves http01, which can't issue wildcards.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth
  namespace: auth
spec:
  commonName: auth.bevsoft.com
  dnsNames:
    - auth.bevsoft.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: auth-tls
